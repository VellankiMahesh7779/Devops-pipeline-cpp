apiVersion: apps/v1

kind: Deployment

metadata:
  name: devops-cpp-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: devops-cpp-app

  template:

    metadata:
      labels:
        app: devops-cpp-app

    spec:
      containers:

      - name: devops-cpp-app

        image: vellankimahesh1999/devops-cpp-app:v2

        ports:
        - containerPort: 9090

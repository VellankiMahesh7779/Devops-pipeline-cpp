<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Store</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;

            /* Spider-Man background */
            background-image:
                linear-gradient(
                    rgba(255, 255, 255, 0.65),
                    rgba(255, 255, 255, 0.75)
                ),
                url("msdhoni.jpg");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;

            min-height: 100vh;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            padding: 50px 20px;
            text-align: center;
        }

        h1 {
            color: #1e293b;
            margin-bottom: 10px;
            font-size: 42px;
        }

        .subtitle {
            color: #475569;
            font-size: 18px;
            margin-bottom: 30px;
        }

        button {
            background: #2563eb;
            color: white;
            border: 2px solid #111827;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-bottom: 30px;
        }

        button:hover {
            background: #1d4ed8;
        }

        #products {
            display: grid;
            grid-template-columns: repeat(
                auto-fit,
                minmax(220px, 1fr)
            );
            gap: 20px;
        }

        .product {
            background: rgba(255, 255, 255, 0.95);
            padding: 25px;
            border-radius: 12px;

            box-shadow:
                0 5px 15px rgba(0, 0, 0, 0.15);

            transition: transform 0.2s;
        }

        .product:hover {
            transform: translateY(-5px);
        }

        .product h3 {
            color: #1e293b;
            margin-bottom: 10px;
            font-size: 22px;
        }

        .price {
            color: #16a34a;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🛒 Product Store</h1>

        <p class="subtitle">
            Products served through our Docker 3-Tier Application
        </p>

        <button onclick="loadProducts()">
            Load Products
        </button>

        <div id="products"></div>

    </div>

    <script>

        async function loadProducts() {

            try {

                const response = await fetch("/api/products");

                if (!response.ok) {
                    throw new Error("Failed to load products");
                }

                const products = await response.json();

                let output = "";

                products.forEach(product => {

                    output += `
                        <div class="product">

                            <h3>
                                ${product.name}
                            </h3>

                            <div class="price">
                                ₹${product.price}
                            </div>

                        </div>
                    `;

                });

                document.getElementById("products").innerHTML = output;

            } catch (error) {

                document.getElementById("products").innerHTML = `
                    <div class="product">
                        <h3>❌ Error</h3>
                        <p>Unable to load products.</p>
                    </div>
                `;

                console.error(error);
            }
        }

    </script>

</body>
</html>
